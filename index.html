  <body>
    <div id="root">
      <div id="app-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;background:linear-gradient(135deg,#2563EB,#1d4ed8,#0ea5e9);font-family:'IBM Plex Sans Thai','Inter',sans-serif;">
        <style>
          @keyframes loaderPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
          @keyframes loaderFadeText{0%,100%{opacity:.6}50%{opacity:1}}
          @keyframes loaderRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
          .ldr-card{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:40px 48px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
          .ldr-ring{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:loaderRing 1s linear infinite}
          .ldr-logo{width:96px;height:96px;border-radius:18px;object-fit:contain;animation:loaderPulse 2s ease-in-out infinite}
          .ldr-icon{width:56px;height:56px;color:#fff;animation:loaderPulse 2s ease-in-out infinite}
          .ldr-name{color:#fff;font-size:20px;font-weight:700;letter-spacing:.02em;text-align:center;max-width:280px;line-height:1.3}
          .ldr-text{color:rgba(255,255,255,.9);font-size:15px;font-weight:500;letter-spacing:.02em;animation:loaderFadeText 2s ease-in-out infinite}
          .ldr-dots{display:inline-flex;gap:4px;margin-left:6px}
          .ldr-dots span{width:6px;height:6px;background:#fff;border-radius:50%;display:inline-block;animation:loaderPulse 1.4s ease-in-out infinite both}
          .ldr-dots span:nth-child(1){animation-delay:0s}
          .ldr-dots span:nth-child(2){animation-delay:.2s}
          .ldr-dots span:nth-child(3){animation-delay:.4s}
        </style>
        <div class="ldr-card">
          <div id="ldr-brand" style="display:none"></div>
          <div id="ldr-name" class="ldr-name" style="display:none"></div>
          <div class="ldr-ring"></div>
          <div class="ldr-text">กำลังโหลดระบบ<span class="ldr-dots"><span></span><span></span><span></span></span></div>
        </div>
      </div>
      <script>
        // โหลด branding จาก CMS ให้หน้า loading ใช้ค่าจริงตั้งแต่ก่อน React เริ่มทำงาน
        (function () {
          var CACHE_KEY = "cms_branding_cache";
          var backendUrl = "%VITE_SUPABASE_URL%";
          var publishableKey = "%VITE_SUPABASE_PUBLISHABLE_KEY%";
          var keys = [
            "app_name",
            "app_short_name",
            "app_favicon_url",
            "school_name",
            "school_short_name",
            "school_logo",
            "school_logo_512",
            "theme_color",
            "primary_color",
            "theme_primary_color"
          ];

          function escapeHtml(value) {
            return String(value || "").replace(/[&<>'"]/g, function (c) {
              return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c];
            });
          }

          function applyBranding(b) {
            if (!b) return;
            window.__branding = b;
            var loader = document.getElementById("app-loader");
            if (loader && b.themeColor) {
              loader.style.background = "linear-gradient(135deg," + b.themeColor + ",#1d4ed8,#0ea5e9)";
            }
            if (b.themeColor) {
              var tc = document.querySelector('meta[name="theme-color"]');
              if (tc) tc.setAttribute("content", b.themeColor);
            }
            if (b.name) {
              document.title = b.name;
              var n = document.getElementById("ldr-name");
              if (n) { n.textContent = b.name; n.style.display = "block"; }
            }
            var brand = document.getElementById("ldr-brand");
            if (brand) {
              if (b.logo) {
                brand.style.display = "block";
                brand.innerHTML = '<img class="ldr-logo" src="' + escapeHtml(b.logo) + '" alt="logo"/>';
              } else {
                brand.style.display = "none";
                brand.innerHTML = "";
              }
            }
            var iconUrl = b.favicon || b.logo;
            if (iconUrl) {
              var ic = document.querySelector('link[rel="icon"]') || document.createElement("link");
              ic.setAttribute("rel", "icon");
              ic.setAttribute("href", iconUrl);
              if (!ic.parentNode) document.head.appendChild(ic);
            }
            try { window.dispatchEvent(new CustomEvent("branding:ready", { detail: b })); } catch (e) {}
          }

          try { applyBranding(JSON.parse(localStorage.getItem(CACHE_KEY) || "null")); } catch (e) {}

          if (!backendUrl || backendUrl.indexOf("%") === 0 || !publishableKey || publishableKey.indexOf("%") === 0) return;

          try {
            var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
            var timer = controller ? setTimeout(function () { controller.abort(); }, 2500) : null;
            var headers = { apikey: publishableKey };
            if (publishableKey.indexOf("sb_publishable_") !== 0) headers.Authorization = "Bearer " + publishableKey;
            fetch(backendUrl + "/rest/v1/cms_settings?select=key,value&key=in.(" + keys.join(",") + ")", {
              headers: headers,
              signal: controller ? controller.signal : undefined
            })
              .then(function (res) { return res.ok ? res.json() : null; })
              .then(function (rows) {
                if (!rows || !rows.length) return;
                var map = {};
                rows.forEach(function (r) { if (r && r.key) map[r.key] = r.value || ""; });
                var name = map.app_name || map.school_name || "";
                var branding = {
                  name: name,
                  shortName: map.app_short_name || map.school_short_name || name,
                  logo: map.school_logo || map.school_logo_512 || map.app_favicon_url || "",
                  favicon: map.app_favicon_url || map.school_logo || "",
                  themeColor: map.theme_color || map.primary_color || map.theme_primary_color || ""
                };
                if (branding.name || branding.logo || branding.favicon || branding.themeColor) {
                  localStorage.setItem(CACHE_KEY, JSON.stringify(branding));
                  applyBranding(branding);
                }
              })
              .catch(function () {})
              .finally(function () { if (timer) clearTimeout(timer); });
          } catch (e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
