name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release build (signed with keystore secrets)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        # npm install tolerates a recently added dependency and refreshes stale
        # lock metadata in the runner instead of aborting with npm ci EUSAGE.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web assets
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Apply CMS branding (app name / icon / theme)
        run: |
          npm i --no-save --legacy-peer-deps sharp || echo "::warning::sharp install failed — icons will keep defaults"
          node scripts/apply-cms-branding.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write google-services.json (FCM push)
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json written (FCM enabled)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — FCM push disabled in this build"
          fi

      - name: Bump app version (unique per build)
        working-directory: android
        run: |
          BASE_VC="$(grep -m1 'versionCode' app/build.gradle | tr -dc '0-9')"
          BASE_VN="$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')"
          MAJOR_MINOR="$(echo "$BASE_VN" | cut -d. -f1,2)"
          NEW_VC=$(( BASE_VC + GITHUB_RUN_NUMBER ))
          NEW_VN="${MAJOR_MINOR}.${NEW_VC}"
          sed -i "s/^versionCode .*/versionCode ${NEW_VC}/" app/build.gradle
          sed -i "s/^versionName .*/versionName \"${NEW_VN}\"/" app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle
          echo "APP_VERSION_CODE=${NEW_VC}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${NEW_VN}" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon


      - name: Build release APK (signed)
        if: github.event_name == 'push' || github.event.inputs.release == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Cannot sign release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bngss-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name == 'push' || github.event.inputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bngss-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to Supabase Storage
        if: github.event_name == 'push' || github.event.inputs.release == 'true'
        working-directory: android
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is empty/missing"
            exit 1
          fi
          BASE="https://gwmszzoqqxmejefhayqf.supabase.co/storage/v1/object"
          VC="$APP_VERSION_CODE"
          VN="$APP_VERSION_NAME"
          FILE="bngss-app-v${VN}-${VC}.apk"
          upload() {
            local path="$1" ctype="$2" target="$3"
            local body_file http_code
            body_file="$(mktemp)"
            http_code="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: $ctype" \
              -H "x-upsert: true" \
              --data-binary "@${path}" \
              "${BASE}/app-downloads/${target}")"
            echo "upload ${target} -> HTTP ${http_code}: $(cat "$body_file")"
            [ "$http_code" = "200" ]
          }

          # ไฟล์ชื่อใหม่ทุกครั้ง (กันไฟล์ทับกันตอนผู้ใช้ดาวน์โหลด)
          upload "app/build/outputs/apk/release/app-release.apk" "application/octet-stream" "$FILE" || exit 1
          # ไฟล์ latest สำหรับลิงก์คงที่
          upload "app/build/outputs/apk/release/app-release.apk" "application/octet-stream" "bngss-app-latest.apk" || exit 1

          printf '{"versionCode":%s,"versionName":"%s","url":"%s","fileName":"%s","mandatory":true,"releasedAt":"%s","notes":"%s"}' \
            "$VC" "$VN" \
            "${BASE}/public/app-downloads/${FILE}" \
            "$FILE" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "อัปเดตเวอร์ชันใหม่ ${VN} (build ${VC})" > /tmp/version.json
          upload "/tmp/version.json" "application/json" "version.json" || exit 1
          echo "version.json updated -> $VN ($VC) / $FILE"
