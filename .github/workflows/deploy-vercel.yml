name: Deploy to Vercel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Prepare Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: phanuponginthapat-netizens-projects
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN secret. Create a token at https://vercel.com/account/tokens (scope: Full Account) and add it as a repository secret."
            exit 1
          fi
          npx --yes vercel@latest build --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" 2>&1 | tail -20

      - name: Deploy to Vercel (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: phanuponginthapat-netizens-projects
        run: |
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" --name bngss --yes 2>&1 | tail -10