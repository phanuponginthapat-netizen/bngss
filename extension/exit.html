<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>ควบคุมเครื่อง — BNG Safe Browser</title>
<style>
  :root { color-scheme: light dark; --bg:#0f172a; --card:#111c33; --fg:#e2e8f0; --mute:#94a3b8; --pri:#38bdf8; --bad:#f87171; --ok:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px system-ui, "Sarabun", sans-serif; }
  main { width:min(560px,94vw); background:var(--card); border:1px solid #1e293b; border-radius:16px; padding:24px; }
  h1 { margin:0 0 4px; font-size:22px; } p { color:var(--mute); margin:0 0 16px; }
  .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .actions button, .back { padding:12px 8px; border-radius:10px; border:1px solid #334155; background:transparent; color:var(--fg); font:inherit; cursor:pointer; }
  .actions button[aria-pressed="true"] { background:var(--pri); color:#0f172a; border-color:var(--pri); font-weight:700; }
  .cam { position:relative; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; }
  .frame { position:absolute; inset:18%; border:3px solid var(--pri); border-radius:12px; }
  #msg { min-height:24px; margin:12px 0; font-weight:600; }
  #msg.bad { color:var(--bad); } #msg.ok { color:var(--ok); }
  .back { width:100%; }
  #scanner { position:absolute; opacity:0; width:1px; height:1px; }
</style></head>
<body><main>
  <h1>⏻ ควบคุมเครื่อง</h1>
  <p>เลือกคำสั่ง แล้วสแกน QR บัตรผู้ดูแลระบบหรือบุคลากรที่กล้องหรือเครื่องอ่าน QR</p>
  <div class="actions" role="group" aria-label="คำสั่ง">
    <button type="button" data-action="exit" aria-pressed="true">ออกจากโปรแกรม</button>
    <button type="button" data-action="shutdown" aria-pressed="false">ปิดเครื่อง</button>
    <button type="button" data-action="restart" aria-pressed="false">รีสตาร์ท</button>
  </div>
  <div class="cam"><video id="video" muted playsinline></video><div class="frame"></div></div>
  <input id="scanner" autocomplete="off" aria-label="ช่องรับเครื่องอ่าน QR">
  <div id="msg" role="status" aria-live="polite">กำลังเปิดกล้อง…</div>
  <button type="button" class="back" id="back">กลับไปใช้งานต่อ</button>
</main>
<script src="jsQR.js"></script>
<script src="exit.js"></script>
</body></html>
