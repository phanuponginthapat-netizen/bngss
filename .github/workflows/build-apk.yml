name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release build (signed with keystore secrets)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Apply CMS branding (app name / icon / theme)
        run: |
          npm i --no-save --legacy-peer-deps sharp || echo "::warning::sharp install failed — icons will keep defaults"
          node scripts/apply-cms-branding.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write google-services.json (FCM push)
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json written (FCM enabled)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — FCM push disabled in this build"
          fi

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed)
        if: github.event.inputs.release == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Cannot sign release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bngss-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event.inputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bngss-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to Supabase Storage
        if: github.event.inputs.release == 'true'
        working-directory: android
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "anon key length: ${#SUPABASE_ANON_KEY}"
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is empty/missing"
            exit 1
          fi
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary "@app/build/outputs/apk/release/app-release.apk" \
            "https://gwmszzoqqxmejefhayqf.supabase.co/storage/v1/object/app-downloads/bngss-app-v1.0.0.apk")"
          echo "Supabase storage upload HTTP $http_code"
          echo "response: $(cat "$body_file")"
          if [ "$http_code" != "200" ]; then
            echo "::error::Failed to upload APK to Supabase Storage (HTTP $http_code)"
            exit 1
          fi