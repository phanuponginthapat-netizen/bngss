  <body>
    <div id="root">
      <div id="app-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;background:linear-gradient(135deg,#2563EB,#1d4ed8,#0ea5e9);font-family:'IBM Plex Sans Thai','Inter',sans-serif;">
        <style>
          @keyframes loaderPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
          @keyframes loaderFadeText{0%,100%{opacity:.6}50%{opacity:1}}
          @keyframes loaderRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
          .ldr-card{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:40px 48px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
          .ldr-ring{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:loaderRing 1s linear infinite}
          .ldr-logo{width:96px;height:96px;border-radius:18px;object-fit:contain;animation:loaderPulse 2s ease-in-out infinite}
          .ldr-icon{width:56px;height:56px;color:#fff;animation:loaderPulse 2s ease-in-out infinite}
          .ldr-name{color:#fff;font-size:20px;font-weight:700;letter-spacing:.02em;text-align:center;max-width:280px;line-height:1.3}
          .ldr-text{color:rgba(255,255,255,.9);font-size:15px;font-weight:500;letter-spacing:.02em;animation:loaderFadeText 2s ease-in-out infinite}
          .ldr-dots{display:inline-flex;gap:4px;margin-left:6px}
          .ldr-dots span{width:6px;height:6px;background:#fff;border-radius:50%;display:inline-block;animation:loaderPulse 1.4s ease-in-out infinite both}
          .ldr-dots span:nth-child(1){animation-delay:0s}
          .ldr-dots span:nth-child(2){animation-delay:.2s}
          .ldr-dots span:nth-child(3){animation-delay:.4s}
        </style>
        <div class="ldr-card">
          <div id="ldr-brand" style="display:none"></div>
          <div id="ldr-name" class="ldr-name" style="display:none"></div>
          <div class="ldr-ring"></div>
          <div class="ldr-text">กำลังโหลดระบบ<span class="ldr-dots"><span></span><span></span><span></span></span></div>
        </div>
      </div>
      <script>
        // ใช้ branding ที่ cache ไว้จากรอบก่อน เพื่อไม่ให้แสดง default ก่อน CMS โหลด
        try {
          var b = JSON.parse(localStorage.getItem("cms_branding_cache") || "null");
          if (b) {
            if (b.themeColor) {
              document.getElementById("app-loader").style.background =
                "linear-gradient(135deg," + b.themeColor + ",#1d4ed8,#0ea5e9)";
              var tc = document.querySelector('meta[name="theme-color"]');
              if (tc) tc.setAttribute("content", b.themeColor);
            }
            if (b.name) {
              document.title = b.name;
              var n = document.getElementById("ldr-name");
              if (n) { n.textContent = b.name; n.style.display = "block"; }
            }
            if (b.logo) {
              var brand = document.getElementById("ldr-brand");
              if (brand) { brand.style.display = "block"; brand.innerHTML = '<img class="ldr-logo" src="' + b.logo + '" alt="logo"/>'; }
              var ic = document.querySelector('link[rel="icon"]');
              if (ic) ic.setAttribute("href", b.logo);
            }
          }
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
