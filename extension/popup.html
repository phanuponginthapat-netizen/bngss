<!doctype html>
<html><head><meta charset="utf-8"><title>Safe Browser</title>
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 13px system-ui; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .brand img { width:36px; height:36px; border-radius:8px; object-fit:cover; background:#f1f5f9; display:none; }
  .brand .txt { min-width:0; }
  .brand h1 { font-size:14px; margin:0; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand .en { font-size:11px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid #eee; justify-content:space-between; }
  .k { color:#666; } .v { font-weight:600; }
  .btn { display:block; width:100%; padding:8px; margin-top:10px; background:#0ea5e9; color:#fff; border:0; border-radius:6px; cursor:pointer; font:inherit;}
  .btn.secondary { background:#64748b; }
  .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  .ok { background:#dcfce7; color:#166534; }
  .no { background:#fee2e2; color:#991b1b; }
</style></head>
<body>
  <div class="brand">
    <img id="brand-logo" alt="" />
    <div class="txt">
      <h1 id="brand-name">🏫 Safe Browser</h1>
      <div class="en" id="brand-en"></div>
    </div>
  </div>
  <div class="row"><span class="k">สถานะ</span><span id="status" class="badge no">ยังไม่เชื่อม</span></div>
  <div class="row"><span class="k">ผู้ใช้</span><span id="user" class="v">—</span></div>
  <div class="row"><span class="k">Blocklist</span><span id="bl" class="v">—</span></div>
  <button class="btn" id="open">เปิดระบบโรงเรียน</button>
  <button class="btn" id="wifi" style="background:#10b981">🛜 จัดการ Wi-Fi</button>
  <button class="btn secondary" id="refresh">รีเฟรชการตั้งค่า</button>
  <script src="popup.js"></script>
</body></html>
