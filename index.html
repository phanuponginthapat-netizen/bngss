  <meta name="twitter:description" content="BNG Smart School ระบบโรงเรียนอัจฉริยะ โรงเรียนบ้านหนองเงือก">
  <!-- Runtime backend config (แก้ได้หลัง deploy โดยไม่ต้อง build ใหม่) -->

  <body>
    <div id="root">
      <div id="app-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;background:linear-gradient(135deg,#e0f2fe 0%,#f0f9ff 45%,#fecaca 100%);font-family:'Figtree','IBM Plex Sans Thai',system-ui,sans-serif;overflow:hidden;">
        <style>
          @keyframes ldrFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
          @keyframes ldrPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(.95)}}
          @keyframes ldrFade{0%,100%{opacity:.6}50%{opacity:1}}
          @keyframes ldrSlide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
          @keyframes ldrBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-15px) scale(1.05)}}
          .ldr-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:ldrBlob 6s ease-in-out infinite}
          .ldr-card{position:relative;background:rgba(255,255,255,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:36px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 25px 60px -20px rgba(56,189,248,.45);max-width:340px;margin:0 16px}
          .ldr-logo-wrap{position:relative;animation:ldrFloat 3s ease-in-out infinite}
          .ldr-logo-glow{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#7dd3fc,#fecaca);filter:blur(20px);opacity:.7;animation:ldrPulse 2s ease-in-out infinite}
          .ldr-logo{position:relative;width:96px;height:96px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,.95);padding:8px;box-shadow:0 8px 20px rgba(0,0,0,.08);border:4px solid #fff}
          .ldr-kiosk-icon{position:relative;width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(15,23,35,.35);animation:ldrFloat 3s ease-in-out infinite}
          .ldr-kiosk-icon svg{width:52px;height:52px;color:#38bdf8}
          .ldr-name{color:#1e293b;font-size:18px;font-weight:700;letter-spacing:-.01em;text-align:center;max-width:260px;line-height:1.35;font-family:'Outfit','IBM Plex Sans Thai',sans-serif}
          .ldr-bar{width:220px;height:8px;border-radius:999px;background:#e0f2fe;overflow:hidden}
          .ldr-bar-fill{width:50%;height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#7dd3fc,#fecaca);animation:ldrSlide 1.4s ease-in-out infinite}
          .ldr-text{color:#475569;font-size:14px;font-weight:500;letter-spacing:.01em;display:flex;align-items:center;gap:6px;animation:ldrFade 2s ease-in-out infinite}
          .ldr-dots{display:inline-flex;gap:4px;margin-left:4px}
          .ldr-dots span{width:6px;height:6px;border-radius:50%;display:inline-block;animation:ldrPulse 1.4s ease-in-out infinite both}
          .ldr-dots span:nth-child(1){background:#38bdf8;animation-delay:0s}
          .ldr-dots span:nth-child(2){background:#fca5a5;animation-delay:.15s}
          .ldr-dots span:nth-child(3){background:#7dd3fc;animation-delay:.3s}
        </style>
        <div class="ldr-blob" style="width:380px;height:380px;background:#7dd3fc;top:-80px;left:-80px"></div>
        <div class="ldr-blob" style="width:440px;height:440px;background:#fecaca;bottom:-120px;right:-100px;animation-delay:1.5s"></div>
        <div class="ldr-card">
          <div id="ldr-kiosk" style="display:none">
            <div class="ldr-kiosk-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                <circle cx="12" cy="7" r="2.5"></circle>
              </svg>
            </div>
          </div>
          <div id="ldr-brand" style="display:none"></div>
          <div id="ldr-name" class="ldr-name" style="display:none"></div>
          <div class="ldr-bar"><div class="ldr-bar-fill"></div></div>
          <div class="ldr-text">กำลังโหลดระบบ<span class="ldr-dots"><span></span><span></span><span></span></span></div>
        </div>
      </div>

      <script>
        // โหลด branding จาก CMS แบบไม่บล็อค — ให้ React เริ่ม mount ทันที
        // (ถ้า fetch ช้าหรือค้าง หน้า loading จะไม่ค้างตาม เพราะ main.tsx โหลดขนานกัน)
        (function () {
          var CACHE_KEY = "cms_branding_cache";
          var DEFAULT_NAME = "BNG Smart School";
          var DEFAULT_KIOSK_NAME = "ตู้สแกนหน้า";
          var __cfg = (window.__BNG_CONFIG__ || {});
          try { var __ls = JSON.parse(localStorage.getItem("bng.backend.config") || "{}"); if (__ls && __ls.url) { __cfg = { SUPABASE_URL: __ls.url, SUPABASE_ANON_KEY: __ls.anonKey }; } } catch (e) {}
          var backendUrl = __cfg.SUPABASE_URL || "";
          var publishableKey = __cfg.SUPABASE_ANON_KEY || "";
          var path = (location && location.pathname) || "";
          var isKiosk = /^\/(kiosk|face-kiosk)(\/|$)/i.test(path) || /^\/kiosk-/i.test(path);
          var keys = [
            "app_name",
            "app_short_name",
            "app_favicon_url",
            "school_name",
            "school_short_name",
            "school_logo",
            "school_logo_512",
            "theme_color",
            "primary_color",
            "theme_primary_color"
          ];

          function escapeHtml(value) {
            return String(value || "").replace(/[&<>'"]/g, function (c) {
              return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c];
            });
          }

          function setKioskLoader() {
            var k = document.getElementById("ldr-kiosk");
            var b = document.getElementById("ldr-brand");
            var n = document.getElementById("ldr-name");
            if (k) k.style.display = "block";
            if (b) b.style.display = "none";
            if (n) { n.textContent = DEFAULT_KIOSK_NAME; n.style.display = "block"; }
            document.title = DEFAULT_KIOSK_NAME;
          }

          function applyBranding(b) {
            if (!b) return;
            window.__branding = b;
            if (isKiosk) {
              setKioskLoader();
              if (b.themeColor) {
                var tc = document.querySelector('meta[name="theme-color"]');
                if (tc) tc.setAttribute("content", b.themeColor);
              }
              try { window.dispatchEvent(new CustomEvent("branding:ready", { detail: b })); } catch (e) {}
              return;
            }
            if (b.themeColor) {
              var tc = document.querySelector('meta[name="theme-color"]');
              if (tc) tc.setAttribute("content", b.themeColor);
            }
            var name = b.name;
            // ถ้าชื่อสั้นเกินไป/ดูเหมือนถูกตัด ให้ fallback เป็นชื่อเต็ม
            if (!name || String(name).replace(/\s/g, "").length < 3) {
              name = DEFAULT_NAME;
            }
            document.title = name;
            var n = document.getElementById("ldr-name");
            if (n) { n.textContent = name; n.style.display = "block"; }
            var brand = document.getElementById("ldr-brand");
            if (brand) {
              if (b.logo) {
                brand.style.display = "block";
                brand.innerHTML = '<div class="ldr-logo-wrap"><div class="ldr-logo-glow"></div><img class="ldr-logo" src="' + escapeHtml(b.logo) + '" alt="logo"/></div>';
              } else {
                brand.style.display = "none";
                brand.innerHTML = "";
              }
            }
            var iconUrl = b.favicon || b.logo;
            if (iconUrl) {
              var ic = document.querySelector('link[rel="icon"]') || document.createElement("link");
              ic.setAttribute("rel", "icon");
              ic.setAttribute("href", iconUrl);
              if (!ic.parentNode) document.head.appendChild(ic);
            }
            try { window.dispatchEvent(new CustomEvent("branding:ready", { detail: b })); } catch (e) {}
          }

          // Kiosk: ใช้ loader ของตู้สแกนหน้าโดยเฉพาะ ไม่ใช้โลโก้ CMS
          if (isKiosk) {
            setKioskLoader();
          } else {
            try { applyBranding(JSON.parse(localStorage.getItem(CACHE_KEY) || "null")); } catch (e) {}
          }

          if (!backendUrl || backendUrl.indexOf("%") === 0 || !publishableKey || publishableKey.indexOf("%") === 0) return;

          try {
            var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
            var timer = setTimeout(function () { try { if (controller) controller.abort(); } catch (e) {} }, 3000);
            var headers = { apikey: publishableKey };
            if (publishableKey.indexOf("sb_publishable_") !== 0) headers.Authorization = "Bearer " + publishableKey;
            fetch(backendUrl + "/rest/v1/cms_settings?select=key,value&key=in.(" + keys.join(",") + ")", {
              headers: headers,
              signal: controller ? controller.signal : undefined
            })
              .then(function (res) { return res.ok ? res.json() : null; })
              .then(function (rows) {
                if (!rows || !rows.length) return;
                var map = {};
                rows.forEach(function (r) { if (r && r.key) map[r.key] = r.value || ""; });
                var name = map.app_name || map.school_name || "";
                var branding = {
                  name: name,
                  shortName: map.app_short_name || map.school_short_name || name,
                  logo: map.school_logo || map.school_logo_512 || map.app_favicon_url || "",
                  favicon: map.app_favicon_url || map.school_logo || "",
                  themeColor: map.theme_color || map.primary_color || map.theme_primary_color || ""
                };
                if (branding.name || branding.logo || branding.favicon || branding.themeColor) {
                  try { localStorage.setItem(CACHE_KEY, JSON.stringify(branding)); } catch (e) {}
                  applyBranding(branding);
                }
              })
              .catch(function () {})
              .finally(function () { clearTimeout(timer); });
          } catch (e) {}
        })();

        // Safety net: ถ้า React ไม่ mount ภายใน 15 วิ (script โหลดพัง / เครือข่ายค้าง)
        // ให้แสดงปุ่มโหลดใหม่แทนหน้า loading ที่ค้างเปล่า ๆ
        setTimeout(function () {
          var loader = document.getElementById("app-loader");
          if (!loader) return; // React mount แล้ว
          var text = loader.querySelector(".ldr-text");
          if (text) {
            text.innerHTML = 'โหลดระบบไม่สำเร็จ · <a href="#" onclick="location.reload();return false;" style="color:#0284c7;text-decoration:underline;font-weight:600;margin-left:4px">โหลดใหม่</a>';
          }
        }, 15000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
