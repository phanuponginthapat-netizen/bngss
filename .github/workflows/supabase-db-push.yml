name: Deploy Supabase Database Migrations

# ทุกครั้งที่ไฟล์ migration ใน supabase/migrations เปลี่ยน จะ push ขึ้น backend ของโรงเรียนอัตโนมัติ
# ต้องตั้ง GitHub Secret: SUPABASE_ACCESS_TOKEN (Personal Access Token จาก Supabase Dashboard)
# ต้องตั้ง GitHub Secret หรือ Variable: SUPABASE_PROJECT_REF (project ref ของ backend ภายนอก)
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-db-push.yml"
  workflow_dispatch:

concurrency:
  group: supabase-db-push
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is not set}"
          : "${PROJECT_REF:?SUPABASE_PROJECT_REF secret is not set}"

      - name: Link Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Repair migration history (remote-only versions)
        run: |
          set -euo pipefail
          # เก็บรายการ version ของไฟล์ migration ในเครื่อง
          ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -r -n1 basename \
            | sed -E 's/^([0-9]+).*/\1/' \
            | sort -u > /tmp/local_versions.txt || true

          # ดึงรายการ migration ที่อยู่บน remote
          supabase migration list --linked > /tmp/mig_list.txt || true
          cat /tmp/mig_list.txt

          awk -F'|' 'NF>=2 {gsub(/ /,"",$1); gsub(/ /,"",$2); if ($2 ~ /^[0-9]+$/) print $1" "$2}' /tmp/mig_list.txt \
            > /tmp/remote_pairs.txt || true

          while read -r local remote; do
            if [ -z "$remote" ]; then continue; fi
            if ! grep -qx "$remote" /tmp/local_versions.txt; then
              echo "Repairing remote-only migration: $remote"
              supabase migration repair --status reverted "$remote"
            fi
          done < /tmp/remote_pairs.txt

      - name: Push migrations
        run: supabase db push

