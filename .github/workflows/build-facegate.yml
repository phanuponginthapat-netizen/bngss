name: Build FaceGate Agent

# โปรแกรมต ู้สแกนหน ้าสำหร ับ PC (scripts/kiosk/facegate-agent)
# เด ิมหน ้าเว็บดาวน ์โหลดไฟล ์ท ี่เก ็บท ั้ งแต ่ร ุ่ นเด ิมในโปรเจกต ์ — ส ่วนท ี่แก ้ทีหลังเข ้าไปไม ่ได ้
# งานน ี ้แพ็กโปรแกรมร ุ่ นล ่ าสุด ตรวจว ่ าคอ ้ดคอมไพล ์ผ ่านและโมด ูลครบ แล ้วให ้ลิงก ์ดาวน ์โหลดเพ ิม
#
# เมือ ่เข ้าส ู่ระบบแล ้ว โปรแกรมท ี่ต ิดต ั้ งไว ้จะตรวจร ุ่ นใหม ่เองจาก facegate-version.json
# (หน ้าต ั้ งเวลาของเคร ื่ องต ู้สแกน ต ้ องเป ิด "อ ัปเดตร ุ่ นใหม ่อ ัตโนมัติ" ด ้วย)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/kiosk/facegate-agent/**'
      - 'scripts/kiosk/package-facegate.sh'
      - '.github/workflows/build-facegate.yml'

permissions:
  contents: write

jobs:
  build-facegate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package FaceGate agent
        env:
          FACEGATE_SITE_URL: https://bngss.lovable.app
          FACEGATE_BUILD_DIR: /tmp/facegate-build
        run: bash scripts/kiosk/package-facegate.sh

      - name: Read version
        id: ver
        run: |
          python3 - <<'PY' > /tmp/fg-env
          import json
          m = json.load(open("/tmp/facegate-build/facegate-version.json"))
          print(f"version={m['version']}")
          print(f"file={m['fileName']}")
          PY
          cat /tmp/fg-env >> "$GITHUB_ENV"
          echo "version=$(grep -m1 '^version=' /tmp/fg-env | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload packaging artifact
        uses: actions/upload-artifact@v4
        with:
          name: facegate-agent-v${{ steps.ver.outputs.version }}
          path: |
            /tmp/facegate-build/facegate-agent-installer.zip
            /tmp/facegate-build/facegate-version.json
          if-no-files-found: error

      - name: Publish to storage (app-downloads)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY missing — skipping publish"
            exit 0
          fi
          FACEGATE_FILE="$(python3 -c 'import json;print(json.load(open("/tmp/facegate-build/facegate-version.json"))["fileName"])')"
          export FACEGATE_FILE
          BASE="https://gwmszzoqqxmejefhayqf.supabase.co/storage/v1/object"
          PUB="https://gwmszzoqqxmejefhayqf.supabase.co/storage/v1/object/public/app-downloads"
          upload() {
            local path="$1" ctype="$2" target="$3" body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w "%{http_code}" -X POST \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: $ctype" \
              -H "x-upsert: true" \
              --data-binary "@${path}" \
              "${BASE}/app-downloads/${target}")"
            echo "upload ${target} -> HTTP ${code}: $(cat "$body")"
            [ "$code" = "200" ]
          }

          # ไฟล ์แปะเวอร ์ชนั (เก ่าผ ู้ใช ้ย ังดาวน ์โหลดต ่ อได ้) + ไฟล ์ latest (ล ิงก ์คงท ี่)
          upload "/tmp/facegate-build/facegate-agent-installer.zip" "application/zip" "$FACEGATE_FILE" || exit 1
          upload "/tmp/facegate-build/facegate-agent-latest.zip" "application/zip" "facegate-agent-latest.zip" || exit 1

          # manifest ให ้หน ้าเว็บ + ต ู้สแกนตรวจร ุ่ นใหม ่ — ช ี้ url ไปย ังไฟล ์แปะเวอร ์ชนั
          python3 - "$PUB" <<'PY'
          import json, sys
          pub = sys.argv[1].rstrip("/")
          m = json.load(open("/tmp/facegate-build/facegate-version.json"))
          m["url"] = f"{pub}/{m['fileName']}"
          json.dump(m, open("/tmp/facegate-build/facegate-version.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("manifest url ->", m["url"])
          PY
          upload "/tmp/facegate-build/facegate-version.json" "application/json" "facegate-version.json" || exit 1

      - name: Commit fresh installer into public/downloads
        # ให ้ล ิงก ์ /downloads/facegate-agent-installer.zip ของหน ้าเว็บเป ็นร ุ่ นล ่ าสุดเสมอ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/facegate-agent-installer.zip
          if git diff --cached --quiet; then
            echo "ไฟล ์ในโปรเจกต ์เป ็นร ุ่ นล ่ าสุดอย ู่แล ้ว — ไม ่ต ้ องเข ียนซ ้้ำ"
            exit 0
          fi
          git commit -m "build(facegate): refresh installer zip [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}" || echo "::warning::push ล ้มเหลว (สาข าอ ่ืน/สิทธิ์) — ไฟล ์ยังอย ู่ใน Actions artifact"

      - name: Stage release file
        run: mkdir -p /tmp/rel && cp /tmp/facegate-build/facegate-agent-installer.zip /tmp/rel/facegate-agent-installer.zip

      - name: Publish to GitHub Release (facegate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/ci/publish-release.sh facegate "FaceGate Agent (PC Windows/Linux)" "v${{ steps.ver.outputs.version }}" /tmp/rel/facegate-agent-installer.zip

  # ตัวติดตั้ง Windows แบบไฟล์เดียว FaceGateSetup.exe (ไม่ต้องลง Python / ไม่มี .bat)
  build-facegate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/kiosk/facegate-agent/requirements.txt pyinstaller==6.11.1

      - name: Download face models (InsightFace buffalo_sc)
        shell: bash
        run: |
          mkdir -p models-tmp scripts/kiosk/facegate-agent/models
          curl -fsSL -o models-tmp/buffalo_sc.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip
          python -c "import zipfile;zipfile.ZipFile('models-tmp/buffalo_sc.zip').extractall('models-tmp')"
          find models-tmp -name 'det_500m.onnx' -exec cp {} scripts/kiosk/facegate-agent/models/ \;
          find models-tmp -name 'w600k_mbf.onnx' -exec cp {} scripts/kiosk/facegate-agent/models/ \;
          ls -la scripts/kiosk/facegate-agent/models
          test -f scripts/kiosk/facegate-agent/models/det_500m.onnx
          test -f scripts/kiosk/facegate-agent/models/w600k_mbf.onnx

      - name: Build FaceGate.exe
        shell: bash
        working-directory: scripts/kiosk/facegate-agent
        run: |
          python -m PyInstaller agent.py --name FaceGate --onedir --noconsole --noconfirm \
            --distpath ../../../dist-facegate --workpath ../../../build-facegate \
            --add-data "models;models" \
            --hidden-import local_api --hidden-import local_ui --hidden-import local_admin_ui \
            --hidden-import local_voice --hidden-import localdb --hidden-import local_rules \
            --collect-submodules uvicorn --collect-data onnxruntime
          test -f ../../../dist-facegate/FaceGate/FaceGate.exe

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^AGENT_VERSION = \"\([^\"]*\)\".*/\1/p' scripts/kiosk/facegate-agent/agent.py | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build FaceGateSetup.exe (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSiteUrl=https://bngss.lovable.app" scripts\kiosk\facegate-agent\windows\FaceGate.iss
          if (-not (Test-Path dist-facegate\FaceGateSetup.exe)) { throw "FaceGateSetup.exe not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: FaceGateSetup-v${{ steps.ver.outputs.version }}
          path: dist-facegate/FaceGateSetup.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (facegate-windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p "$HOME/bin" && printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/bin/python3" && chmod +x "$HOME/bin/python3"
          export PATH="$HOME/bin:$PATH"
          bash scripts/ci/publish-release.sh facegate-windows "FaceGate สำหรับ Windows (ตัวติดตั้ง .exe)" "v${{ steps.ver.outputs.version }}" dist-facegate/FaceGateSetup.exe
