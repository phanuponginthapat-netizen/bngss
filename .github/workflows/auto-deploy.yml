name: Auto Deploy Web

# Backend deployment is managed by Lovable Cloud, not GitHub CLI jobs.
# GitHub continues to build and deploy the web through the existing Vercel job.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      functions: ${{ steps.filter.outputs.functions }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "db=true"        >> "$GITHUB_OUTPUT"
            echo "functions=true" >> "$GITHUB_OUTPUT"
            echo "web=true"       >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}" || git ls-files)"
          fi
          echo "$CHANGED"
          has() { echo "$CHANGED" | grep -qE "$1" && echo true || echo false; }
          echo "db=$(has '^supabase/migrations/')"                                   >> "$GITHUB_OUTPUT"
          echo "functions=$(has '^supabase/(functions/|config\.toml)')"              >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(src/|public/|index\.html|package(-lock)?\.json|vite\.config\.ts|vercel\.json|tailwind\.config\.ts)')" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/deploy-vercel.yml
    secrets: inherit
