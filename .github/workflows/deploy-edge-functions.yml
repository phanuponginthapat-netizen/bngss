name: Deploy Supabase Edge Functions

# ทุกครั้งที่โค้ดใน supabase/functions เปลี่ยน จะ deploy ขึ้น Supabase ของโรงเรียนอัตโนมัติ
# ต้องตั้ง GitHub Secret: SUPABASE_ACCESS_TOKEN (Personal Access Token จาก Supabase Dashboard)
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: gwmszzoqqxmejefhayqf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in _shared|migrate-auth-push) continue ;; esac
            echo "--> $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
          done
