<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>ถูกบล็อก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#dc2626; --brand2:#f97316; --ink:#450a0a; --muted:#78350f;
    --card:rgba(255,255,255,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:"IBM Plex Sans Thai",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1000px 600px at 10% -10%, #fecaca 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #fed7aa 0%, transparent 55%),
      linear-gradient(135deg,#fff1f2,#fff7ed);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:720px}
  .brand{display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:18px}
  .brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;
    box-shadow:0 6px 18px rgba(220,38,38,.25); background:#fff}
  .brand .name{font-weight:700; font-size:18px; color:#111827}
  .brand .en{font-size:12px; color:#64748b; margin-top:-2px}

  .card{
    position:relative; overflow:hidden;
    background:var(--card);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,.7);
    border-radius:24px;
    padding:36px 32px 28px;
    box-shadow:0 30px 80px -20px rgba(220,38,38,.35), 0 2px 8px rgba(0,0,0,.04);
    text-align:center;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background:linear-gradient(90deg,var(--brand),var(--brand2));
  }
  .shield{
    width:88px;height:88px;margin:4px auto 10px; border-radius:50%;
    background:linear-gradient(135deg,#fee2e2,#ffedd5);
    display:flex;align-items:center;justify-content:center; font-size:44px;
    box-shadow:inset 0 0 0 1px rgba(220,38,38,.15), 0 10px 30px -10px rgba(220,38,38,.4);
  }
  h1{margin:6px 0 4px; font-size:26px; color:#991b1b; letter-spacing:.2px}
  .sub{color:var(--muted); font-size:14px; margin:0 0 18px}
  .reason{
    display:inline-block; max-width:100%;
    background:linear-gradient(135deg,#fef2f2,#fff7ed);
    border:1px solid #fecaca; color:#7f1d1d;
    padding:12px 16px; border-radius:12px; font-weight:500;
    margin:6px 0 14px; word-break:break-word;
  }
  .u{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
    color:#64748b; background:#f8fafc; border:1px dashed #e2e8f0;
    border-radius:10px; padding:8px 12px; word-break:break-all; margin:6px auto 18px;
    max-width:100%;
  }
  .foot{font-size:12px;color:#64748b; margin:4px 0 18px; display:flex; gap:8px; align-items:center; justify-content:center}
  .foot .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
  .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 20px; border-radius:12px; text-decoration:none; font-weight:600;
    border:1px solid transparent; cursor:pointer; font-size:14px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{
    color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 10px 24px -8px rgba(220,38,38,.55);
  }
  .btn-ghost{background:#fff; color:#334155; border-color:#e2e8f0}
  .school-foot{margin-top:18px; text-align:center; color:#64748b; font-size:12px}
</style></head><body>
<div class="wrap">
  <div class="brand">
    <img id="brand-logo" alt="" style="display:none" />
    <div>
      <div class="name" id="brand-name">Safe Browser</div>
      <div class="en" id="brand-en"></div>
    </div>
  </div>

  <div class="card">
    <div class="shield" id="shield">🛡️</div>
    <h1 id="title">ถูกบล็อกโดยระบบโรงเรียน</h1>
    <p class="sub" id="sub">เว็บไซต์นี้อยู่นอกเหนือขอบเขตที่โรงเรียนอนุญาต</p>
    <div class="reason" id="reason">กำลังตรวจสอบเหตุผล…</div>
    <div class="u" id="url"></div>
    <div class="foot"><span class="dot"></span> การเข้าถึงถูกบันทึกและแจ้งผู้ดูแลระบบแล้ว</div>
    <div class="actions">
      <a class="btn btn-primary" id="home-btn" href="#">🏠 กลับสู่ระบบโรงเรียน</a>
      <a class="btn btn-primary" id="login-btn" href="#" style="display:none">🔑 เข้าสู่ระบบ</a>
      <button class="btn btn-ghost" id="back-btn" type="button">← ย้อนกลับ</button>
    </div>
  </div>

  <div class="school-foot" id="school-foot"></div>
</div>
<script src="blocked.js"></script>
</body></html>
