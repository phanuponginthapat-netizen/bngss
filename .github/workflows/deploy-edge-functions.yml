name: Managed Cloud Functions

# Compatibility entrypoint for older callers; the managed Cloud is authoritative.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Managed Cloud deployment ownership
        run: echo "Edge functions are deployed from Lovable Cloud. No external project deployment is performed."
